# .github/workflows/deploy.yml
name: Portfolio

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install django-distill python-decouple pillow

      - name: Setup Database
        run: |
          python manage.py migrate
          # La ligne suivante est commentée pour éviter l'erreur si le fichier manque
          # python manage.py loaddata initial_data.json 
            
      - name: Generate Static Site
        env:
          DJANGO_SETTINGS_MODULE: portfolio_site.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          # 1. Rassembler les fichiers statiques dans STATIC_ROOT
          python manage.py collectstatic --noinput
          # 2. Créer le dossier de sortie
          mkdir -p dist 
          # 3. Lancer votre script de génération
          python generate_static.py

      - name: Configure GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/dev'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          # Note: vatosoa.github.io ne fonctionne que si le repo est nommé 'Vatosoa.github.io'
          # Sinon, utilisez le nom par défaut ou configurez votre domaine.
          cname: vatosoa.github.io 
